<header class="header">
  <div class="header-left">
    <a routerLink="/home" class="logo-link" (click)="closeMobileMenu()">
      <!-- CalculHub Premium SVG Logo -->
      <svg class="logo-svg" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="CalculHub Logo">
        <defs>
          <!-- Primary Red Glow Gradient -->
          <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FF5B70" />
            <stop offset="50%" stop-color="#E11931" />
            <stop offset="100%" stop-color="#990F1E" />
          </linearGradient>
          
          <!-- White-to-Grey Accent Gradient for calculator buttons -->
          <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
            <stop offset="100%" stop-color="#8F8F8F" stop-opacity="0.6" />
          </linearGradient>

          <!-- Glowing drop shadow filter -->
          <filter id="logo-glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="2.5" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
          </filter>
        </defs>

        <!-- Glassmorphic Rounded Outer Frame -->
        <rect x="2" y="2" width="36" height="36" rx="9" fill="#151515" fill-opacity="0.75" stroke="url(#logo-grad)" stroke-width="2" />

        <!-- Grid of Calculator Keys (Minimalist & Futuristic) -->
        <!-- Top Left Key -->
        <rect x="8" y="9" width="6" height="6" rx="1.5" fill="url(#accent-grad)" />
        <!-- Top Right Key -->
        <rect x="17" y="9" width="6" height="6" rx="1.5" fill="url(#accent-grad)" />
        <!-- Bottom Left Key -->
        <rect x="8" y="18" width="6" height="6" rx="1.5" fill="url(#accent-grad)" />

        <!-- Calculations-to-Hub Growth Trendline (Starts inside and bursts out) -->
        <path d="M 11 27 C 15 27, 21 24, 24 17 C 26 12, 30 9, 32 7" stroke="url(#logo-grad)" stroke-width="2.5" stroke-linecap="round" fill="none" filter="url(#logo-glow)" />
        <!-- Trendline Glowing Arrowhead -->
        <path d="M 28 7 H 32 V 11" stroke="url(#logo-grad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#logo-glow)" />

        <!-- Node Dots/Points on the Hub line to emphasize Interconnection (Hub) -->
        <circle cx="11" cy="27" r="2" fill="#FF5B70" filter="url(#logo-glow)" />
        <circle cx="24" cy="17" r="1.5" fill="#FFFFFF" />
        <circle cx="32" cy="7" r="2" fill="#FF9FAB" filter="url(#logo-glow)" />
      </svg>
      <span class="app-name">CalculHub</span>
    </a>
  </div>

  <div class="header-right">
    <nav class="navigation">
      <a routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a>
      <a routerLink="/sitemap" [class.active]="isCalculatorsActive()">Calculators</a>
      <a routerLink="/blog" routerLinkActive="active">Blog</a>
      <a routerLink="/about" routerLinkActive="active">About</a>
    </nav>
    <button class="hamburger-menu-btn" (click)="toggleMobileMenu()" [attr.aria-expanded]="isMobileMenuOpen()" aria-label="Toggle mobile menu">
      <lucide-icon [name]="isMobileMenuOpen() ? 'x' : 'menu'" [size]="26"></lucide-icon>
    </button>
  </div>
</header>

@if (isMobileMenuOpen() && !hasSidePanel()) {
<div class="mobile-navigation-overlay" (click)="closeMobileMenu()">
  <nav class="mobile-navigation" (click)="$event.stopPropagation()">
    <a routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" (click)="closeMobileMenu()">Home</a>
    <a routerLink="/sitemap" [class.active]="isCalculatorsActive()" (click)="closeMobileMenu()">Calculators</a>
    <a routerLink="/blog" routerLinkActive="active" (click)="closeMobileMenu()">Blog</a>
    <a routerLink="/about" routerLinkActive="active" (click)="closeMobileMenu()">About</a>
  </nav>
</div>
}
