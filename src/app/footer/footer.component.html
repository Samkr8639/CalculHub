    @for (social of socialLinks; track social.name) {
      <a [href]="social.link" target="_blank" rel="noopener noreferrer" class="social-icon" aria-label="{{ social.name }}">
        <lucide-icon [name]="social.iconName" [size]="20" />
      </a>
    }
  </div>
  <nav class="legal-nav" aria-label="Legal pages">

    <a routerLink="/terms">Terms &amp; Conditions</a>
    <span class="sep">·</span>
    <a routerLink="/contact">Contact Us</a>
    <span class="sep">·</span>
    <a routerLink="/blog">Blog</a>
    <span class="sep">·</span>
    <a routerLink="/about">About</a>
  </nav>

</footer>
