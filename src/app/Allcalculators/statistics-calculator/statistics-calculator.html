<div class="statistics-calculator-card">
  <h2>Statistics Calculator</h2>

  <div class="form-group">
    <label for="data">Data</label>
    <input type="text" id="data" class="form-control" [value]="data()" (input)="onDataChange($event)" placeholder="Enter comma-separated numbers, e.g., 1, 2, 3, 4, 5">
  </div>

  <button (click)="calculate()" class="btn btn-calculate">Calculate</button>

  @if (error()) {
    <div class="error-message">
      <p>{{ error() }}</p>
    </div>
  }

  @if (mean() !== null) {
    <div class="result-section">
      <h3>Results</h3>
      <div class="result-grid">
        <div class="result-item">
          <span class="label">Mean</span>
          <span class="value">{{ mean()?.toFixed(2) }}</span>
        </div>
        <div class="result-item">
          <span class="label">Median</span>
          <span class="value">{{ median()?.toFixed(2) }}</span>
        </div>
        <div class="result-item">
          <span class="label">Mode</span>
          <span class="value">{{ mode()?.join(', ') || 'N/A' }}</span>
        </div>
      </div>
    </div>
  }
</div>
