<div class="calculator-card">
  <h2>BMI Calculator</h2>

  <div class="calculator-content">
    <div class="form-group">
      <label for="height">Height (cm)</label>
      <input type="number" id="height" class="form-control" [ngModel]="height()" (ngModelChange)="height.set($event)" placeholder="e.g. 175">
    </div>

    <div class="form-group">
      <label for="weight">Weight (kg)</label>
      <input type="number" id="weight" class="form-control" [ngModel]="weight()" (ngModelChange)="weight.set($event)" placeholder="e.g. 70">
    </div>

    <button (click)="calculate()" class="btn btn-calculate">Calculate BMI</button>

    @if (error()) {
      <div class="error-message">
        <p>{{ error() }}</p>
      </div>
    }

    @if (bmi() !== null) {
      <div class="result-section">
        <h3>Results</h3>
        <div class="result-grid">
          <div class="result-item highlight">
            <span class="label">Your BMI</span>
            <span class="value">{{ bmi()?.toFixed(1) }}</span>
          </div>
          <div class="result-item">
            <span class="label">Category</span>
            <span class="value" [class]="categoryClass()">{{ category() }}</span>
          </div>
        </div>

        <div class="bmi-scale">
          <div class="scale-segment underweight" [class.active]="category() === 'Underweight'">Under<br>&#60;18.5</div>
          <div class="scale-segment normal" [class.active]="category() === 'Normal weight'">Normal<br>18.5-24.9</div>
          <div class="scale-segment overweight" [class.active]="category() === 'Overweight'">Over<br>25-29.9</div>
          <div class="scale-segment obese" [class.active]="category() === 'Obese'">Obese<br>&#62;30</div>
        </div>
      </div>
    }
  </div>
</div>
