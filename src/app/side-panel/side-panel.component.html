<!-- Floating toggle button for mobile/tablet screens -->
<button class="mobile-toggle-btn" (click)="toggleSidebar()" [attr.aria-expanded]="isOpen()" aria-label="Toggle navigation menu">
  <lucide-icon [name]="isOpen() ? 'x' : 'menu'" [size]="22"></lucide-icon>
</button>

<!-- Backdrop overlay for mobile screens -->
@if (isOpen()) {
  <div class="sidebar-backdrop" (click)="closeSidebar()"></div>
}

<div class="side-panel" [class.open]="isOpen()">
  <!-- Close button inside side panel (only shown on mobile) -->
  <button class="mobile-close-btn" (click)="closeSidebar()" aria-label="Close navigation menu">
    <lucide-icon name="x" [size]="20"></lucide-icon>
  </button>

  @for (category of categoryKeys(); track category) {
  <div class="category-section">
    <h3 (click)="toggleCategory(category)" [class.collapsed]="collapsedCategories()[category]"
        role="button" tabindex="0" [attr.aria-expanded]="!collapsedCategories()[category]">
      {{ category }}
      <span class="toggle-icon">
        <lucide-icon [name]="collapsedCategories()[category] ? 'chevron-right' : 'chevron-down'" [size]="20" />
      </span>
    </h3>
    @if (!collapsedCategories()[category]) {
    <ul>
      @for (card of categorizedCalculators()[category]; track card.title) {
      <li>
      <a [routerLink]="card.link"
             [class.active-link]="isActive(card.link)"
             (click)="onCalculatorClick(card.title); closeSidebar()">
          <span class="icon"><lucide-icon [name]="card.icon" [size]="16" /></span>
          {{ card.title }}
        </a>
      </li>
      }
    </ul>
    }
  </div>
  }
</div>
