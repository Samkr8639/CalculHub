<div class="share-container">
  <div class="share-title">
    <span class="material-symbols-outlined share-header-icon">share</span>
    <h4>Share Your Results</h4>
  </div>
  
  <div class="share-buttons">
    <button (click)="shareWhatsApp()" class="share-btn whatsapp" title="Share on WhatsApp">
      <svg viewBox="0 0 24 24" class="share-svg"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946C.06 5.348 5.397.01 12.008.01c3.202.001 6.212 1.246 8.477 3.514 2.266 2.268 3.507 5.28 3.505 8.484-.004 6.657-5.34 11.997-11.953 11.997-2.005-.001-3.973-.502-5.734-1.456L0 24zm6.59-4.846c1.6.95 3.588 1.485 5.407 1.486 5.49.003 9.953-4.437 9.957-9.896.002-2.644-1.029-5.13-2.907-7.01-1.878-1.879-4.373-2.912-7.025-2.913-5.492 0-9.957 4.437-9.96 9.898-.001 1.938.508 3.824 1.47 5.514L2.651 21.462l5.996-1.564l-.001-.001c-.001 0-.001-.001 0 0zm11.196-4.9c-.27-.135-1.597-.788-1.846-.878-.248-.09-.43-.135-.61.135-.18.27-.697.878-.853 1.058-.157.18-.314.202-.584.067-1.127-.565-1.922-.974-2.685-2.28-.202-.345.202-.321.579-1.077.067-.135.034-.253-.017-.354-.05-.1-.43-1.036-.59-1.42-.156-.373-.315-.323-.43-.323-.11-.002-.238-.002-.365-.002-.128 0-.335.048-.51.238-.176.19-.672.658-.672 1.605s.689 1.86.787 1.995c.098.135 1.356 2.07 3.285 2.902.46.197.818.316 1.097.404.462.147.882.126 1.214.077.37-.055 1.597-.653 1.821-1.282.225-.63.225-1.17.157-1.283-.067-.113-.248-.202-.518-.337z"/></svg>
      <span>WhatsApp</span>
    </button>
    
    <button (click)="shareTwitter()" class="share-btn twitter" title="Share on Twitter/X">
      <svg viewBox="0 0 24 24" class="share-svg"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
      <span>Twitter</span>
    </button>
    
    <button (click)="shareLinkedIn()" class="share-btn linkedin" title="Share on LinkedIn">
      <svg viewBox="0 0 24 24" class="share-svg"><path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.779-1.75-1.75s.784-1.75 1.75-1.75 1.75.779 1.75 1.75-.784 1.75-1.75 1.75zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/></svg>
      <span>LinkedIn</span>
    </button>
    
    <button (click)="copyLink()" class="share-btn copy" [class.copied]="copied()" title="Copy Link to Clipboard">
      <span class="material-symbols-outlined btn-icon">
        {{ copied() ? 'check_circle' : 'content_copy' }}
      </span>
      <span>{{ copied() ? 'Link Copied!' : 'Copy Link' }}</span>
    </button>
  </div>
</div>
